ottom:1px solid #ddd;font-size:18px}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.05;margin:0 .15em}.frac span:first-child{border-bottom:1px solid currentColor;padding:0 .18em}.sheet{background:white;padding:22px;margin:18px 0;border:1px solid #ccc}.brandprint{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--tier);padding-bottom:8px}.brandprint img{width:55px;height:55px;object-fit:contain}.pq{font-size:17px;margin:18px 0;break-inside:avoid}.work{height:90px;border-bottom:1px dotted #aaa;margin-top:8px}.progressgrid>div{margin:14px 0;display:grid;grid-template-columns:minmax(220px,1fr) 160px 120px;gap:12px;align-items:center}progress{width:100%;accent-color:var(--tier)}select{padding:8px}.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.section-card{border:1px solid #e4e7ec;border-radius:10px;padding:14px;background:#fff}.section-card h3{margin:0 0 8px}.meta{color:var(--muted);font-size:14px}.scorebtns{margin-top:9px}.scorebtns button{font-size:13px;padding:7px 10px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{max-height:310px;border-right:0;border-bottom:1px solid #ddd}header img{width:64px;height:64px}.progressgrid>div{grid-template-columns:1fr}}@media print{body *{visibility:hidden!important}.printme,.printme *{visibility:visible!important}.printme{position:absolute;left:0;top:0;width:100%;border:0;margin:0;padding:10mm}.work{height:32mm}button{display:none!important}}

const SECTION_DATA=[{"title": "Understanding Fractions", "prereq": "Know that a fraction represents equal parts of a whole.", "learn": "A fraction has a numerator (top) and denominator (bottom). Equivalent fractions have the same value. To simplify, divide the numerator and denominator by a common factor greater than 1. Improper fractions can be converted to mixed numbers and mixed numbers back to improper fractions.", "mistake": "Only simplify when the numerator and denominator have a common factor greater than 1; a fraction already in its simplest form should be left unchanged.", "factories": ["identify_parts", "equivalent_fraction", "simplify_fraction", "improper_to_mixed", "mixed_to_improper"]}, {"title": "Comparing & Ordering Fractions", "prereq": "Be able to recognise equivalent fractions.", "learn": "To compare fractions, use a common denominator or convert to decimals when convenient. For several fractions, rewrite them in a comparable form and then order from smallest to largest or largest to smallest.", "mistake": "Do not compare denominators alone. A larger denominator does not automatically mean a larger fraction.", "factories": ["compare_fractions", "order_fractions"]}, {"title": "Fractions of Amounts", "prereq": "Know what the numerator and denominator mean.", "learn": "To find a fraction of an amount, divide by the denominator and multiply by the numerator. For example, to find 3/5 of 40: 40 ÷ 5 = 8, then 8 × 3 = 24.", "mistake": "Divide by the denominator first, then multiply by the numerator.", "factories": ["fraction_of_amount", "fraction_of_amount_word"]}, {"title": "Adding & Subtracting Fractions", "prereq": "Be able to generate equivalent fractions.", "learn": "Fractions can only be added or subtracted directly when they have the same denominator. Find a common denominator, rewrite the fractions, then add or subtract the numerators. Simplify the final answer where possible.", "mistake": "Do not add or subtract the denominators. First make the denominators the same.", "factories": ["add_same_den", "add_diff_den", "sub_diff_den"]}, {"title": "Multiplying Fractions", "prereq": "Be able to simplify fractions.", "learn": "Multiply the numerators together and the denominators together, then simplify. You may cancel common factors before multiplying to keep numbers smaller.", "mistake": "Do not find a common denominator when multiplying fractions.", "factories": ["multiply_fractions", "integer_times_fraction"]}, {"title": "Dividing Fractions", "prereq": "Be confident multiplying fractions.", "learn": "To divide by a fraction, multiply by its reciprocal: keep the first fraction, change ÷ to ×, then invert the second fraction. Simplify the answer.", "mistake": "Only invert the divisor (the second fraction), not both fractions.", "factories": ["divide_fractions", "integer_div_fraction"]}, {"title": "Decimal Place Value & Ordering", "prereq": "Know place value for whole numbers.", "learn": "Digits to the right of the decimal point represent tenths, hundredths and thousandths. Compare decimals by aligning decimal points and comparing digits from left to right. Round using the digit immediately to the right of the required place.", "mistake": "Do not assume the decimal with more digits is larger: 0.8 is greater than 0.75.", "factories": ["decimal_place_value", "order_decimals", "round_decimal"]}, {"title": "Calculating with Decimals", "prereq": "Be able to add, subtract, multiply and divide whole numbers.", "learn": "For addition and subtraction, align decimal points. For multiplication, calculate as whole numbers then place the decimal point. For division by 10, 100 or 1000, move each digit to a place of smaller value.", "mistake": "When adding or subtracting, line up decimal points rather than the final digits.", "factories": ["decimal_add", "decimal_sub", "decimal_mult", "decimal_div10"]}, {"title": "Fraction ↔ Decimal", "prereq": "Know that a fraction means division.", "learn": "Convert a fraction to a decimal by dividing numerator by denominator. Convert a terminating decimal to a fraction using place value, then simplify.", "mistake": "When converting a decimal to a fraction, simplify the fraction fully.", "factories": ["fraction_to_decimal", "decimal_to_fraction"]}, {"title": "Fraction ↔ Percentage", "prereq": "Be able to convert fractions to decimals or equivalent fractions out of 100.", "learn": "A percentage is a fraction out of 100. Convert a fraction to a percentage by multiplying its value by 100. Convert a percentage to a fraction by writing it over 100 and simplifying.", "mistake": "Remember that 25% means 25/100, not 25/10.", "factories": ["fraction_to_percent", "percent_to_fraction"]}, {"title": "Decimal ↔ Percentage", "prereq": "Understand place value to hundredths.", "learn": "To convert a decimal to a percentage, multiply by 100. To convert a percentage to a decimal, divide by 100.", "mistake": "0.4 is 40%, not 4%.", "factories": ["decimal_to_percent", "percent_to_decimal"]}, {"title": "Key FDP Equivalences", "prereq": "Be able to convert between fractions, decimals and percentages.", "learn": "Learn common equivalences so they can be recognised immediately: 1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 3/4 = 0.75 = 75%, 1/5 = 0.2 = 20%, 1/10 = 0.1 = 10%, 1/8 = 0.125 = 12.5%.", "mistake": "Keep the three forms matched to the same value; do not confuse 1/5 = 20% with 1/4 = 25%.", "factories": ["equivalence_missing", "equivalence_match"]}, {"title": "Percentages of Amounts", "prereq": "Know benchmark percentages such as 50%, 25%, 10%, 5% and 1%.", "learn": "Use mental methods for friendly percentages and a general method for any percentage. For example, 15% can be found as 10% + 5%. Alternatively convert the percentage to a decimal and multiply.", "mistake": "A percentage of an amount is found by multiplying by the percentage as a decimal or fraction, not by adding the percentage number.", "factories": ["percent_of_amount_friendly", "percent_of_amount_general"]}, {"title": "Estimating Percentages", "prereq": "Be able to round numbers and find simple percentages mentally.", "learn": "Estimate by rounding the percentage and/or amount to friendly values, then calculate mentally. The aim is a sensible approximate answer rather than an exact one.", "mistake": "Do not present an over-precise answer when the question asks for an estimate.", "factories": ["estimate_percent"]}, {"title": "One Amount as a Percentage of Another", "prereq": "Be able to divide and multiply by 100.", "learn": "Use: part ÷ whole × 100. The 'whole' is the quantity being compared with. Answers can be greater than 100% when the first quantity is larger than the comparison quantity.", "mistake": "Divide by the comparison/original amount, not automatically by the larger number.", "factories": ["one_as_percent_another", "percent_over_100"]}, {"title": "Percentage Increase & Decrease", "prereq": "Be able to find a percentage of an amount.", "learn": "Find the percentage change and then add it for an increase or subtract it for a decrease. A multiplier can also be used: for example, a 20% increase uses 1.20 and a 20% decrease uses 0.80.", "mistake": "For a decrease, subtract the percentage amount from the original; do not subtract the percentage number itself.", "factories": ["percent_increase", "percent_decrease"]}, {"title": "Percentage Change", "prereq": "Know how to find the difference between two values.", "learn": "Percentage change = change ÷ original × 100. Always divide by the original value, whether the change is an increase or a decrease.", "mistake": "The denominator is the original value, not the new value.", "factories": ["percentage_change_inc", "percentage_change_dec"]}, {"title": "Reverse Percentages", "prereq": "Understand percentage multipliers.", "learn": "When the final value is known, divide by the multiplier to recover the original. For example, after a 20% increase the multiplier is 1.2, so original = final ÷ 1.2.", "mistake": "Do not simply subtrac const $=s=>document.querySelector(s); const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a; const pick=a=>a[rnd(0,a.length-1)];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1}
function simp(n,d){let g=gcd(n,d);return [n/g,d/g]}
function frac(n,d,reduce=true){if(reduce)[n,d]=simp(n,d);if(d===1)return `${n}`;return `<span class="frac"><span>${n}</span><span>${d}</span></span>`}

function q(prompt,answer,solution){return {prompt,answer,solution}}
function factory(id,challenge=false){let a,b,c,d,n,m,p,x,y,g,ans,inc,oldv,newv;
 switch(id){
 case 'identify_parts': d=rnd(3,12);n=rnd(1,d-1);return q(`For the fraction ${frac(n,d,false)}, state the numerator and denominator.`,`numerator ${n}, denominator ${d}`,`The numerator is the top number, <b>${n}</b>. The denominator is the bottom number, <b>${d}</b>.`);
 case 'equivalent_fraction': d=rnd(2,10);n=rnd(1,d-1);m=rnd(2,6);return q(`Complete the equivalent fraction: ${frac(n,d,false)} = ${frac(n*m,'□',false)}` ,`${d*m}`,`The numerator was multiplied by ${m}, so multiply the denominator by ${m}: ${d} × ${m} = <b>${d*m}</b>.`);
 case 'simplify_fraction': g=rnd(2,9);d=rnd(2,12);n=rnd(1,d-1);while(gcd(n,d)!==1){d=rnd(2,12);n=rnd(1,d-1)}return q(`Simplify ${frac(n*g,d*g,false)}.`,pf(n,d),`Both ${n*g} and ${d*g} are divisible by ${g}. Divide top and bottom by ${g}: ${frac(n*g,d*g,false)} = <b>${frac(n,d,false)}</b>.`);
 case 'improper_to_mixed': d=rnd(2,9);n=d*rnd(1,5)+rnd(1,d-1);let w=Math.floor(n/d),r=n%d,rg=gcd(r,d);return q(`Write ${frac(n,d,false)} as a mixed number.`,mixed(n,d),`${n} ÷ ${d} = ${w} remainder ${r}.<br><br>The ${w} is the whole-number part. The remainder ${r} becomes the numerator of the fractional part, while the original denominator stays as ${d}: ${frac(r,d,false)}.${rg>1?`<br><br>Simplify ${frac(r,d,false)} by dividing the numerator and denominator by ${rg}: ${frac(r,d)}.`:''}<br><br>Therefore ${frac(n,d,false)} = <b>${w} ${frac(r,d)}</b>.`);
 case 'mixed_to_improper': d=rnd(2,9);a=rnd(1,5);n=rnd(1,d-1);return q(`Write ${a} ${frac(n,d,false)} as an improper fraction.`,pf(a*d+n,d),`${a} × ${d} + ${n} = ${a*d+n}, so <b>${frac(a*d+n,d,false)}</b>.`);

 case 'order_fractions': let ds=pick([[4,6,12],[5,10,20],[3,6,9]]);let fs=ds.map(dd=>[rnd(1,dd-1),dd]);fs.sort((u,v)=>u[0]/u[1]-v[0]/v[1]);let shown=[...fs].sort(()=>Math.random()-.5);return q(`Put in ascending order: ${shown.map(z=>frac(z[0],z[1],false)).join(', ')}`,fs.map(z=>pf(z[0],z[1])).join(', '),`Compare using common denominators or decimals. Ascending order is <b>${fs.map(z=>frac(z[0],z[1],false)).join(', ')}</b>.`);
 case 'fraction_of_amount': d=pick([2,3,4,5,6,8,10]);n=rnd(1,d-1);a=d*rnd(3,30);return q(`Find ${frac(n,d,false)} of ${a}.`,fmt(a/d*n),`${a} ÷ ${d} = ${a/d}; then ${a/d} × ${n} = <b>${a/d*n}</b>.`);

 case 'add_same_den': d=rnd(4,12);a=rnd(1,d-2);b=rnd(1,d-a-1);return q(`Calculate ${frac(a,d,false)} + ${frac(b,d,false)}.`,pf(a+b,d),`The denominators are already the same: ${frac(a+b,d,false)} = <b>${frac(a+b,d)}</b>.`);

 case 'sub_diff_den': d=pick([3,4,5,6,8]);b=pick([3,4,5,6,8]);while(b===d)b=pick([3,4,5,6,8]);a=rnd(1,d-1);c=rnd(1,b-1);if(a/d<c/b)[a,c,d,b]=[c,a,b,d];ans=[a*b-c*d,d*b];return q(`Calculate ${frac(a,d,false)} − ${frac(c,b,false)}.`,pf(...ans),`Use a common denominator: ${frac(a*b,d*b,false)} − ${frac(c*d,d*b,false)} = ${frac(ans[0],ans[1],false)} = <b>${frac(ans[0],ans[1])}</b>.`);
 case 'multiply_fractions': d=rnd(2,10);b=rnd(2,10);a=rnd(1,d-1);c=rnd(1,b-1);return q(`Calculate ${frac(a,d,false)} × ${frac(c,b,false)}.`,pf(a*c,d*b),`Multiply: ${frac(a*c,d*b,false)}. Simplify to <b>${frac(a*c,d*b)}</b>.`);

 case 'divide_fractions': d=rnd(2,9);b=rnd(2,9);a=rnd(1,d-1);c=rnd(1,b-1);return q(`Calculate ${frac(a,d,false)} ÷ ${frac(c,b,false)}.`,pf(a*b,d*c),`Multiply by the reciprocal: ${frac(a,d,false)} × ${frac(b,c,false)} = ${frac(a*b,d*c,false)} = <b>${frac(a*b,d*c)}</b>.`);
 case 'integer_div_fraction': d=rnd(2,8);a=rnd(1,d-1);b=rnd(2,8);return q(`Calculate ${b} ÷ ${frac(a,d,false)}.`,pf(b*d,a),`${b} × ${frac(d,a,false)} = ${frac(b*d,a,false)} = <b>${frac(b*d,a)}</b>.`);
 case 'decimal_place_value': let places=['tenths','hundredths','thousandths'];let digs=[rnd(1,9),rnd(1,9),rnd(1,9)];let idx=rnd(0,2);return q(`In 4.${digs.join('')}, what is the value of the digit ${digs[idx]}?`,fmt(digs[idx]/10**(idx+1),3),`The digit is in the ${places[idx]} column, so its value is <b>${fmt(digs[idx]/10**(idx+1),3)}</b>.`);
 case 'order_decimals': let vals=[];while(vals.length<4){let v=rnd(1,999)/1000;if(!vals.includes(v))vals.push(v)}let sorted=[...vals].sort((u,v)=>u-v);return q(`Put in ascending order: ${vals.map(v=>fmt(v,3)).join(', ')}`,sorted.map(v=>fmt(v,3)).join(', '),`Align decimal points and compare place values. Answer: <b>${sorted.map(v=>fmt(v,3)).join(', ')}</b>.`);

 case 'fraction_to_decimal': d=pick([2,4,5,8,10,20,25]);a=rnd(1,d-1);return q(`Convert ${frac(a,d,false)} to a decimal.`,fmt(a/d,4),`${a} ÷ ${d} = <b>${fmt(a/d,4)}</b>.`);
 case 'decimal_to_fraction': let opts=[[0.2,1,5],[0.25,1,4],[0.4,2,5],[0.6,3,5],[0.75,3,4],[0.125,1,8],[0.35,7,20]];let e=pick(opts);return q(`Convert ${e[0]} to a fraction in simplest form.`,pf(e[1],e[2]),`${e[0]} as a fraction of a power of 10 simplifies to <b>${frac(e[1],e[2])}</b>.`);
 case 'fraction_to_percent': let ep=pick([[1,2,50],[1,4,25],[3,4,75],[1,5,20],[2,5,40],[1,8,12.5],[3,8,37.5]]);return q(`Convert ${frac(ep[0],ep[1],false)} to a percentage.`,`${ep[2]}%`,`Multiply the fraction value by 100: <b>${ep[2]}%</b>.`);
 case 'percent_to_fraction': let pp=pick([10,20,25,30,40,50,60,75,80,12.5]);let den=pp===12.5?8:100,num=pp===12.5?1:pp;return q(`Convert ${pp}% to a fraction in simplest form.`,pf(num,den),`${pp}% means ${frac(num,den,false)} before simplifying. Therefore <b>${frac(num,den)}</b>.`);

 case 'percent_to_decimal': p=rnd(1,175);return q(`Convert ${p}% to a decimal.`,fmt(p/100,2),`${p} ÷ 100 = <b>${fmt(p/100,2)}</b>.`);
 case 'equivalence_missing': let eq=pick([[1,2,0.5,50],[1,4,0.25,25],[3,4,0.75,75],[1,5,0.2,20],[1,8,0.125,12.5],[1,10,0.1,10]]);return q(`Complete: ${frac(eq[0],eq[1],false)} = ${eq[2]} = ____%`,`${eq[3]}%`,`These are equivalent forms of the same value, so the missing percentage is <b>${eq[3]}%</b>.`);

 case 'one_as_percent_another': b=rnd(20,120);a=rnd(1,b);ans=a/b*100;return q(`Express ${a} as a percentage of ${b}.`,`${fmt(ans,2)}%`,`${a} ÷ ${b} × 100 = <b>${fmt(ans,2)}%</b>.`);
 case 'percent_over_100': b=rnd(20,80);a=rnd(b+1,b*3);ans=a/b*100;return q(`Express ${a} as a percentage of ${b}.`,`${fmt(ans,2)}%`,`${a} ÷ ${b} × 100 = <b>${fmt(ans,2)}%</b>. Because ${a}>${b}, the answer is above 100%.`);
 case 'percent_increase': a=rnd(5,80)*10;p=pick([5,10,15,20,25,30]);ans=a*(1+p/100);return q(`Increase ${a} by ${p}%.`,fmt(ans,2),`${p}% of ${a} = ${fmt(a*p/100,2)}. Add this to ${a}: <b>${fmt(ans,2)}</b>.`);

 case 'percentage_change_inc': oldv=rnd(20,100)*5;newv=oldv+rnd(1,10)*5;ans=(newv-oldv)/oldv*100;return q(`A value increases from ${oldv} to ${newv}. Find the percentage increase.`,`${fmt(ans,2)}%`,`Change = ${newv-oldv}. Percentage change = ${newv-oldv} ÷ ${oldv} × 100 = <b>${fmt(ans,2)}%</b>.`);

function pickQuestion(section,challenge=false){let ids=section.factories;let id=pick(ids);return factory(id,challenge)}
function label(id){return id.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}
function brand(){return `<div class="brandprint"><img src="${LOGO}"><b>Mr Nathan's Maths Tuition</b></div>`}
function navHTML(){return `<div class="aside-title">Sections</div><button class="navitem ${current===-1?'active':''}" onclick="current=-1;render()">Course Overview</button>`+SECTION_DATA.map((s,i)=>`<button class="navitem ${i===current?'active':''}" onclick="current=${i};mode='learn';render()">${i+1}. ${s.title}</button>`).join('')+`<button class="navitem master" onclick="mastery()">Full Mastery Test</button><button class="navitem" onclick="progressPage()">Progress Dashboard</button>`}
function overview(){document.querySelector('.tabs').style.display='none';$('#sectionTitle').textContent='Course Overview';$('#content').innerHTML=`<div class="card"><h2>${TIER} Sections</h2><p>This product is organised into ${SECTION_DATA.length} sections. Each section contains teaching, a worked example for every tested skill, an interactive test and printable practice.</p><div class="overview-grid">${SECTION_DATA.map((s,i)=>`<div class="section-card"><h3>${i+1}. ${s.title}</h3><div class="meta">${s.factories.length} question types</div><p>${s.learn}</p><button class="small" onclick="current=${i};mode='learn';render()">Open Section</button></div>`).join('')}</div></div>`}
function learnHTML(s){return `<div class="card"><h2>Learning Phase</h2><div class="pre"><b>What you should know before this section</b><br>${s.prereq}</div><p>${s.learn}</p><h3>Skills covered</h3><ul class="skills">${s.factories.map(x=>`<li>${label(x)}</li>`).join('')}</ul><h3>Worked Examples for Every Skill</h3><p>Each skill that can appear in the testing phase is taught below with its own worked example.</p>${s.factories.map((id,i)=>{let ex=factory(id,false);return `<div class="example"><h4>${i+1}. ${label(id)}</h4><div class="q"><b>Example:</b> ${ex.prompt}</div><div class="solution"><b>Worked solution:</b><br>${ex.solution}<br><b>Answer:</b> ${ex.answer}</div></div>`}).join('')}<div class="tip"><b>Common mistake:</b> ${s.mistake}</div></div>`}
function qBlock(o,i){return `<div class="testq"><b>${i+1}.</b> ${o.prompt}<div><button class="small" onclick="this.nextElementSibling.hidden=false">Worked Solution</button><div hidden class="solution">${o.solution}<br><b>Answer:</b> ${o.answer}<div class="scorebtns"><button onclick="record(${current},true)">I was correct</button><button class="secondary" onclick="record(${current},false)">I need more practice</button></div></div></div></div>`}
function testHTML(s){active=Array.from({length:5},()=>pickQuestion(s,false));return `<div class="card"><h2>Interactive Testing Phase</h2><p>Five fresh questions from this section are generated. Work each one out before revealing the solution.</p>${active.map(qBlock).join('')}<button onclick="render()">Generate New Questions</button></div>`}
function printableHTML(s){return `<div class="card"><h2>Printable Practice</h2><p>Generate 5–8 questions from this section with working space and a matching worked-solutions sheet.</p><label>Questions <select id="pcount"><option>5</option><option>6</option><option>7</option><option>8</option></select></label> <label>Level <select id="plevel"><option value="0">Standard Practice</option><option value="1">Challenge Practice</option></select></label><button onclick="makePrint()">Generate Printable Questions</button><div id="printarea"></div></div>`}
function makePrint(){let s=SECTION_DATA[current],n=+$('#pcount').value,ch=$('#plevel').value==='1',qs=Array.from({length:n},()=>pickQuestion(s,ch));$('#printarea').innerHTML=`<div id="questionsheet" class="sheet"><div class="sheethead">${brand()}<h2>${s.title} — ${ch?'Challenge':'Standard'} Practice</h2></div>${qs.map((o,i)=>`<div class="pq"><b>${i+1}.</b> ${o.prompt}<div class="work"></div></div>`).join('')}</div><button onclick="printNode('#questionsheet')">Print Questions</button><button onclick="document.querySelector('#psol').hidden=false">Show Worked Solutions</button><div id="psol" hidden class="sheet">${brand()}<h2>${s.title} — Worked Solutions</h2>${qs.map((o,i)=>`<div class="pq"><b>${i+1}.</b> ${o.prompt}<div class="solution">${o.solution}<br><b>Answer:</b> ${o.answer}</div></div>`).join('')}</div><button onclick="printNode('#psol')">Print Worked Solutions</button>`}
function printNode(sel){let n=$(sel);n.classList.add('printme');window.print();n.classList.remove('printme')}
function loadProg(){return JSON.parse(localStorage.getItem(KEY)||'{}')}
function record(i,correct){let p=loadProg();if(!p[i])p[i]={a:0,c:0};p[i].a++;if(correct)p[i].c++;localStorage.setItem(KEY,JSON.stringify(p));}
function progressPage(){current=-2;document.querySelector('.tabs').style.display='none';$('#sectionTitle').textContent='Progress Dashboard';let p=loadProg();$('#content').innerHTML=`<div class="card"><h2>Progress Dashboard</h2><p>Progress is stored on this device. Record whether you were correct after checking each worked solution.</p><div class="progressgrid">${SECTION_DATA.map((s,i)=>{let v=p[i]||{a:0,c:0},pc=v.a?Math.round(v.c/v.a*100):0,status=v.a<5?'Not enough evidence':pc>=80?'Secure':pc>=60?'Developing':'Needs practice';return `<div><span>${i+1}. ${s.title}<br><small>${v.c}/${v.a} correct — ${status}</small></span><progress max="100" value="${pc}"></progress><b>${pc}%</b></div>`}).join('')}</div><button class="danger" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(KEY);progressPage()}">Reset Progress</button></div>`;$('#nav').innerHTML=navHTML();}
function mastery(){current=-3;document.querySelector('.tabs').style.display='none';$('#sectionTitle').textContent='Full Mastery Test';let qs=SECTION_DATA.map((s,i)=>({section:s.title,...pickQuestion(s,true)}));$('#content').innerHTML=`<div class="card"><h2>Full Mastery Test</h2><p>This balanced test contains one question from every section, so all areas are represented.</p><button onclick="mastery()">Generate New Test</button><button onclick="printNode('#masterysheet')">Print Test</button><div id="masterysheet" class="sheet">${brand()}<h2>${TIER} Full Mastery Test</h2>${qs.map((o,i)=>`<div class="pq"><b>${i+1}.</b> ${o.prompt}<div class="work"></div></div>`).join('')}</div><button onclick="document.querySelector('#mastersol').hidden=false">Show Worked Solutions</button><div id="mastersol" hidden class="sheet">${brand()}<h2>${TIER} Full Mastery Test — Worked Solutions</h2>${qs.map((o,i)=>`<div class="pq"><b>${i+1}. ${o.section}</b><br>${o.prompt}<div class="solution">${o.solution}<br><b>Answer:</b> ${o.answer}</div></div>`).join('')}</div><button onclick="printNode('#mastersol')">Print Worked Solutions</button></div>`;$('#nav').innerHTML=navHTML();}
function setMode(m){mode=m;render()}
function render(){$('#nav').innerHTML=navHTML();if(current===-1){overview();return}if(current<0)return;document.querySelector('.tabs').style.display='flex';let s=SECTION_DATA[current];$('#sectionTitle').textContent=`${current+1}. ${s.title}`;$('#content').innerHTML=mode==='learn'?learnHTML(s):mode==='test'?testHTML(s):printableHTML(s);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));}
render();
</script></body></html>
